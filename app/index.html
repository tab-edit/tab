<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab-edit</title>
    <link rel="icon" href="../demo/tab-edit-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">
        <img src="../demo/tab-edit-logo.svg" width="32" height="32" alt="" />
        <span>tab-edit</span>
      </h1>
      <select id="sample-picker" class="sample-picker" title="load a sample tab"></select>
      <div class="actions">
        <button id="import-xml">Import MusicXML…</button>
        <button id="export-xml">Export MusicXML</button>
        <button id="export-midi">Export MIDI</button>
        <button id="dev-toggle" class="ghost" title="show what the engine computed for this document">dev</button>
        <span id="remote-status" class="remote-status"></span>
        <input id="import-xml-file" type="file" accept=".musicxml,.xml" hidden />
      </div>
    </header>
    <main class="layout">
      <section id="editor" class="pane editor-pane"></section>
      <aside class="pane sheet-pane">
        <h2>
          <button
            id="sheet-toggle"
            class="pane-caret"
            aria-expanded="true"
            title="collapse the sheet pane"
          >
            ▾
          </button>
          Sheet <span class="pane-sub">the MusicXML export, rendered live</span>
          <button id="sheet-mode" class="ghost" title="switch between tab and standard notation">
            standard notation
          </button>
        </h2>
        <div id="sheet-status" class="sheet-status" hidden></div>
        <div id="sheet-score" class="sheet-score"></div>
        <!-- Dev drawer: everything here is WIRE data (snapshot values), so it
             costs the audited bundle nothing. Hidden by default — the clean
             two-pane page is the product; this is for when you want to see
             what the engine decided. -->
        <div id="dev-drawer" class="dev-drawer" hidden>
          <details open>
            <summary>At cursor</summary>
            <div id="dev-cursor" class="dev-body"></div>
          </details>
          <details>
            <summary>Diagnostics <span id="dev-diag-count" class="dev-count"></span></summary>
            <div id="dev-diagnostics" class="dev-body"></div>
          </details>
          <details>
            <summary>Syntax at cursor</summary>
            <div id="dev-tree" class="dev-body"></div>
          </details>
          <details>
            <summary>Snapshot</summary>
            <div id="dev-snapshot" class="dev-body"></div>
          </details>
        </div>
      </aside>
    </main>
    <footer class="transport">
      <button id="play" title="play from the cursor — or just your selection (Space)">▶</button>
      <span id="transport-time" class="transport-time"></span>
      <input
        id="transport-slider"
        class="transport-slider"
        type="range"
        min="0"
        max="1000"
        value="0"
        disabled
      />
      <button id="follow" class="ghost active" disabled aria-pressed="true">⌖ follow</button>
      <select id="timbre-picker" class="sample-picker" title="playback sound for pitched notes">
        <option value="plucked">plucked</option>
        <option value="tone">tone</option>
        <option value="soft">soft</option>
      </select>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
