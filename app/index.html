<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab-edit</title>
    <link rel="icon" href="../demo/tab-edit-logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="brand">
        <img src="../demo/tab-edit-logo.svg" width="32" height="32" alt="" />
        <span>tab-edit</span>
      </h1>
      <select id="sample-picker" class="sample-picker" title="load a sample tab"></select>
      <div class="actions">
        <button id="import-xml">Import MusicXML…</button>
        <button id="export-xml">Export MusicXML</button>
        <button id="export-midi">Export MIDI</button>
        <button id="dev-toggle" class="ghost" title="show what the engine computed for this document">dev</button>
        <span id="remote-status" class="remote-status"></span>
        <input id="import-xml-file" type="file" accept=".musicxml,.xml" hidden />
      </div>
    </header>
    <main class="layout">
      <section id="editor" class="pane editor-pane"></section>
      <aside class="pane sheet-pane">
        <h2>
          <button
            id="sheet-toggle"
            class="pane-caret"
            aria-expanded="true"
            title="collapse the sheet pane"
          >
            ▾
          </button>
          Sheet <span class="pane-sub">the MusicXML export, rendered live</span>
          <button id="sheet-mode" class="ghost" title="switch between tab and standard notation">
            standard notation
          </button>
        </h2>
        <div id="sheet-status" class="sheet-status" hidden></div>
        <div id="sheet-score" class="sheet-score"></div>
      </aside>
    </main>
    <!-- THE DEV SURFACE — one master switch (#dev-toggle / ?dev=1), off by
         default: the product page is two clean panes until someone asks for
         more. Organised by QUESTION, not by data structure: four lenses, one
         at a time, over a permanent context bar. Nothing here runs, renders
         or queries while the switch is off. -->
    <section id="dev-drawer" class="dev-drawer" hidden aria-label="developer surface">
      <div id="dev-resize" class="dev-resize" title="drag to resize"></div>
      <div class="dev-bar">
        <div id="dev-breadcrumb" class="dev-breadcrumb" title="the node chain at the cursor — click to select a node's range"></div>
        <div
          id="dev-savings"
          class="dev-savings"
          title="what the last window actually cost, against this document's own cold boot"
        ></div>
        <div class="dev-lenses" role="tablist" aria-label="lenses">
          <button class="dev-lens" data-lens="values" role="tab" aria-selected="true" title="what the engine decided here (⌥1)">Values</button>
          <button class="dev-lens" data-lens="cost" role="tab" aria-selected="false" title="what the work cost (⌥2)">Cost</button>
          <button class="dev-lens" data-lens="tree" role="tab" aria-selected="false" title="the document tree (⌥3)">Tree</button>
          <button class="dev-lens" data-lens="problems" role="tab" aria-selected="false" title="diagnostics (⌥4)">
            Problems <span id="dev-diag-count" class="dev-count"></span>
          </button>
        </div>
        <button id="dev-refresh" class="ghost" title="re-read at the cursor (⌥R)">↻</button>
      </div>
      <div id="dev-watch" class="dev-watch" hidden></div>

      <div id="lens-values" class="dev-lens-body">
        <div id="values-toolbar" class="dev-toolbar"></div>
        <div id="values-teach" class="dev-teach" hidden></div>
        <div id="values-claims" class="dev-claims"></div>
        <div id="values-rows" class="dev-rows"></div>
        <div id="values-footer" class="dev-footer"></div>
      </div>

      <div id="lens-cost" class="dev-lens-body" hidden>
        <div id="cost-toolbar" class="dev-toolbar"></div>
        <div id="cost-teach" class="dev-teach" hidden></div>
        <div id="cost-headline" class="dev-headline"></div>
        <div id="cost-body" class="dev-rows"></div>
      </div>

      <div id="lens-tree" class="dev-lens-body" hidden>
        <div id="tree-toolbar" class="dev-toolbar"></div>
        <div id="tree-teach" class="dev-teach" hidden></div>
        <div id="tree-body" class="dev-tree"></div>
      </div>

      <div id="lens-problems" class="dev-lens-body" hidden>
        <div id="problems-teach" class="dev-teach" hidden></div>
        <div id="dev-diagnostics" class="dev-rows"></div>
      </div>
    </section>
    <footer class="transport">
      <button id="play" title="play from the cursor — or just your selection (Space)">▶</button>
      <span id="transport-time" class="transport-time"></span>
      <input
        id="transport-slider"
        class="transport-slider"
        type="range"
        min="0"
        max="1000"
        value="0"
        disabled
      />
      <button id="follow" class="ghost active" disabled aria-pressed="true">⌖ follow</button>
      <select id="timbre-picker" class="sample-picker" title="playback sound for pitched notes">
        <option value="plucked">plucked</option>
        <option value="tone">tone</option>
        <option value="soft">soft</option>
      </select>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
