<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tab-edit demo</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>tab-edit</h1>
      <select id="sample-picker" class="sample-picker" title="load a sample tab"></select>
      <div class="actions">
        <label class="toggle" title="Alt+drag makes a column selection (plain-drag-always breaks double-click word-select, so it stays Alt-gated)">
          <input id="toggle-column-selection" type="checkbox" checked />
          column select (Alt+drag)
        </label>
        <label class="toggle">
          <input id="toggle-highlight-selection" type="checkbox" checked />
          highlight selection
        </label>
        <button id="import-xml">Import MusicXML</button>
        <input id="import-xml-file" type="file" accept=".musicxml,.xml" hidden />
        <button id="export-xml">Export MusicXML</button>
        <button id="export-midi">Export MIDI</button>
      </div>
    </header>
    <main class="layout">
      <section id="editor" class="pane editor-pane"></section>
      <aside class="side-panes">
        <section class="pane pane-sheet">
          <h2>Sheet <span class="pane-sub">the MusicXML export, rendered live</span></h2>
          <div id="sheet" class="pane-body sheet-body">
            <div class="sheet-controls">
              <button id="sheet-mode">standard notation</button>
            </div>
            <div id="sheet-status" class="sheet-status" hidden></div>
            <div id="sheet-score"></div>
          </div>
        </section>
        <section class="pane pane-inspector">
          <h2 title="each row: value · who could shape it · who ran">Inspector <span class="pane-sub">click a note or measure in the editor — its computed values appear here</span></h2>
          <div id="inspector" class="pane-body inspector-body"></div>
        </section>
        <section class="pane pane-ast collapsed">
          <h2>AST</h2>
          <div id="ast" class="pane-body ast-body"></div>
        </section>
        <section class="pane pane-diagnostics collapsed">
          <h2>Diagnostics</h2>
          <div id="diagnostics" class="pane-body diagnostics-body"></div>
        </section>
        <section class="pane pane-activity collapsed">
          <h2>Activity <span class="pane-sub">what actually computed since the last refresh</span></h2>
          <div id="activity" class="pane-body activity-body"></div>
        </section>
      </aside>
    </main>
    <footer class="hint" id="tip"></footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
